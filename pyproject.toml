[project]
name = "t3"
version = "0.1.0"
description = "T3 — Triathlon Training Agent: personal AI triathlon coach"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=21.0",
    "google-genai>=0.8.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9", "ty"]

[tool.ruff]
line-length = 120
target-version = "py312"
lint.ignore = ["E731"]   # allow lambda methods inside other methods

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: marks tests requiring live credentials (gcal, intervals.icu)",
]
